# deploy/compose.yaml do projeto (perfil deploy, alvo vps-docker). Mantido pelo projeto; o alvo copia este arquivo
# para o servidor a cada publicação. Nunca ponha segredo aqui: eles ficam no servidor (app.env, ou o arquivo de
# VPS_ENV_ARQUIVO), descritos no runbook.
# Cada serviço de deploy.servicos lê a sua imagem em ${BB_IMAGEM_<SERVICO>} (ex.: api → ${BB_IMAGEM_API}); com um só
# serviço, ${BB_IMAGEM} também serve. Serviços fora dessa lista (banco, proxy) nunca são recriados pelo deploy.
services:
  app:
    image: ${BB_IMAGEM_APP}      # sempre um digest (imagem@sha256:…), escrito pelo alvo
    restart: unless-stopped
    env_file: [app.env]
    ports: ["127.0.0.1:8080:8080"]   # atrás do proxy reverso com TLS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]   # deploy.caminho_saude
      interval: 30s
      retries: 3
  migrar:                         # deploy.servico_migrar
    image: ${BB_IMAGEM_APP}
    env_file: [app.env]
    command: ["<comando de migração da stack>"]
    profiles: ["migrar"]          # só roda com `alvo.sh migrar`, antes da troca de versão
  # checar:                       # opcional (deploy.servico_checar = "checar"): confere o servidor antes de migrar;
  #   image: ${BB_IMAGEM_APP}     # se falhar, nada muda no ar
  #   env_file: [app.env]
  #   command: ["<comando que confere as variáveis obrigatórias>"]
  #   profiles: ["checar"]
