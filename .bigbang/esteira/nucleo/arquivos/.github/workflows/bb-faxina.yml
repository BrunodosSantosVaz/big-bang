# Automatic recovery complements cleanup already performed by publication and sprint closure.
name: Faxina

on:
  workflow_run:
    workflows: ['Publicar em produção', 'Publicar sem release', 'Encerrar']
    types: [completed]
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só mostrar o plano'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: bb-faxina
  cancel-in-progress: false

jobs:
  faxina:
    if: ${{ vars.PROJETO_OWNER != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROJETO_TOKEN }}
          persist-credentials: false
      - name: Apagar branches concluídas e conferir sobras
        run: bash .bigbang/esteira/nucleo/scripts/faxina.sh
        env:
          GH_TOKEN: ${{ secrets.PROJETO_TOKEN }}
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular || false }}
          FAXINA_EXIGIR_LIMPA: 'true'
