name: Tarefa
description: Tarefa de um épico. Normalmente criada pelo botão Iniciar sprint.
labels: ["task"]
body:
  - type: input
    attributes:
      label: Épico
      description: "#n"
    validations:
      required: true
  - type: textarea
    attributes:
      label: O que fazer
    validations:
      required: true
  - type: textarea
    attributes:
      label: Critérios cobertos
      description: CA-n do épico.
  - type: textarea
    attributes:
      label: Regras de negócio
  - type: textarea
    attributes:
      label: Arquivos prováveis
  - type: textarea
    attributes:
      label: Depende de
      description: Tarefas do mesmo épico (#n).
