# Gerado pelo Big Bang v0.12.0 a partir de .bigbang/esteira/nucleo/arquivos/.github/workflows/bb-criar-branches.yml. Não edite: personalize em bigbang.toml.
# Botão "Criar branches" (spec 11.6, passo 4). Também roda sozinho depois de cada merge num epico/* (Mesclar PR).
name: Criar branches

on:
  workflow_dispatch:
    inputs:
      epico:
        description: 'Número do épico; vazio = todos em desenvolvimento'
        required: false
        type: string
      simular:
        description: 'Só mostrar o plano'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bb-criar-branches
  cancel-in-progress: false

jobs:
  criar:
    if: ${{ vars.PROJETO_OWNER != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Criar branches
        run: bash .bigbang/esteira/nucleo/scripts/criar-branches.sh
        env:
          GH_TOKEN: ${{ secrets.PROJETO_TOKEN }}
          EPICO: ${{ inputs.epico }}
          SIMULAR: ${{ inputs.simular }}
          PROJETO_OWNER: ${{ vars.PROJETO_OWNER }}
          PROJETO_PLANEJAMENTO: ${{ vars.PROJETO_PLANEJAMENTO }}
          PROJETO_EXECUCAO: ${{ vars.PROJETO_EXECUCAO }}
