# Gerado pelo Big Bang v2.0.0 a partir de .bigbang/esteira/nucleo/arquivos/.github/workflows/bb-kanban.yml. Não edite: personalize em bigbang.toml.
# Move os cartões dos painéis e converte o formulário do épico em labels (spec 11.1). Precisa do segredo
# PROJETO_TOKEN e das variáveis PROJETO_*. Em eventos de PR, os scripts vêm do SHA da branch de destino.
name: Kanban

on:
  issues:
    types: [opened, edited, labeled, reopened]
  push:
    branches: ['teste/**', 'feature/**', 'docs/**', 'bugfix/**', 'hotfix/**']
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# One group per issue/PR AND per event kind (action + label): GitHub keeps only one pending run per group and drops
# the older one, so distinct events of the same issue (closed then reopened, two decision labels in a row) must not
# share a group. Only identical events replace each other.
concurrency:
  group: bb-kanban-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}-${{ github.event.action }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  mover:
    if: ${{ vars.PROJETO_OWNER != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Mover cartões
        run: bash .bigbang/esteira/nucleo/scripts/kanban.sh
        env:
          GH_TOKEN: ${{ secrets.PROJETO_TOKEN }}
          PROJETO_OWNER: ${{ vars.PROJETO_OWNER }}
          PROJETO_PLANEJAMENTO: ${{ vars.PROJETO_PLANEJAMENTO }}
          PROJETO_EXECUCAO: ${{ vars.PROJETO_EXECUCAO }}
          PROJETO_BUGS: ${{ vars.PROJETO_BUGS }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          BODY_FROM: ${{ github.event.changes.body.from }}
          REF_NAME: ${{ github.ref_name }}
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
