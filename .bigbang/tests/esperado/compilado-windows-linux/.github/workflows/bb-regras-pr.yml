# Gerado pelo Big Bang v1.5.3 a partir de .bigbang/esteira/nucleo/arquivos/.github/workflows/bb-regras-pr.yml. Não edite: personalize em bigbang.toml.
# Job obrigatório `regras` (spec 14.2 e 15.5). Os scripts e o bigbang.toml vêm da ponta ATUAL da branch de DESTINO
# (protegida): o PR não consegue mudar as regras que o julgam. Não o base.sha do evento, que fica congelado no último
# push do PR e julgaria com regras antigas depois que o destino avança (achado do piloto).
name: Regras do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bb-regras-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regras:
    name: regras
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Conferir regras
        run: bash .bigbang/esteira/nucleo/scripts/regras-pr.sh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
