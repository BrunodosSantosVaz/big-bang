# Gerado pelo Big Bang v1.5.1 a partir de .bigbang/esteira/nucleo/arquivos/.github/workflows/bb-ci.yml. Não edite: personalize em bigbang.toml.
# Job obrigatório `check` (spec 14.2): os comandos da stack do bigbang.toml, documentação e bb verificar.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'epico/**', 'release/**']

permissions:
  contents: read

concurrency:
  group: bb-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: bb verificar (framework, camada gerada e workflows)
        run: python .bigbang/bin/bb.py verificar
      - name: Instalar
        run: bash .bigbang/esteira/nucleo/scripts/comando.sh instalar
      - name: Lint
        run: bash .bigbang/esteira/nucleo/scripts/comando.sh lint
      - name: Tipos
        run: bash .bigbang/esteira/nucleo/scripts/comando.sh tipos
      - name: Arquitetura
        run: bash .bigbang/esteira/nucleo/scripts/comando.sh arquitetura
      - name: Build
        run: bash .bigbang/esteira/nucleo/scripts/comando.sh build
      - name: Testes e cobertura (completos ou afetados no Flash)
        run: bash .bigbang/esteira/nucleo/scripts/testes.sh
        env:
          BB_BASE_TESTES: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Ordem da regressão (PR de bug)
        if: ${{ startsWith(github.head_ref, 'bugfix/') || startsWith(github.head_ref, 'hotfix/') }}
        run: bash .bigbang/esteira/nucleo/scripts/regressao.sh
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Documentação (Markdown e links)
        run: python .bigbang/bin/bb.py esteira documentacao
