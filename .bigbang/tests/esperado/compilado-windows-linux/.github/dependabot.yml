# Gerado pelo Big Bang v1.5.1 a partir de .bigbang/esteira/nucleo/arquivos/.github/dependabot.yml.tmpl. Não edite: personalize em bigbang.toml.
# Atualizações agrupadas e mensais (spec 14.2 e 11.12): actions do GitHub vão para a develop (sem-release);
# pacotes da stack vão para a main e entram juntos numa release de manutenção ("atualizar dependências").
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "sem-release"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      pip:
        patterns: ["*"]
