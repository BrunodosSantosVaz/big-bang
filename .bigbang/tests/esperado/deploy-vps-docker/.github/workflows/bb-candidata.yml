# Gerado pelo Big Bang v1.5.4 a partir de .bigbang/esteira/perfis/deploy/arquivos/.github/workflows/bb-candidata.yml.tmpl. Não edite: personalize em bigbang.toml.
# Candidata do perfil deploy (spec 14.4): a cada push em release/**, testes, imagens (deploy.servicos) construídas UMA
# vez para deploy.plataformas e publicadas por digest, Trivy, staging (migração, publicação, saúde, smoke e ZAP), pre-release vX.Y.Z-rc.N com o digest
# (imagem.txt), SBOM e atestado, e então épico ou bug em Homologação com o PR release -> main.
name: Candidata

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: bb-candidata-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-24.04
    outputs:
      pular: ${{ steps.v.outputs.pular }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Versão e número da candidata
        id: v
        run: bash .bigbang/esteira/nucleo/scripts/candidata-preparar.sh

  imagem:
    needs: preparar
    if: ${{ needs.preparar.outputs.pular != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      imagem: ${{ steps.i.outputs.imagem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: bash .bigbang/esteira/nucleo/scripts/comando.sh instalar
      - name: Validar testes (Flash reutiliza CI do mesmo commit)
        run: bash .bigbang/esteira/nucleo/scripts/testes-candidata.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Entrar no GHCR
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      # QEMU só trabalha quando deploy.plataformas tem uma arquitetura diferente da do runner (ex.: linux/arm64).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Imagens (uma vez, por digest) e Trivy
        id: i
        run: bash .bigbang/esteira/perfis/deploy/scripts/candidata-imagem.sh
        env:
          TAG: ${{ needs.preparar.outputs.tag }}

  staging:
    concurrency:
      group: bb-staging
      cancel-in-progress: false
    needs: [preparar, imagem]
    runs-on: ["ubuntu-24.04"]
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Staging pelo alvo vps-docker (migração, publicação, saúde, smoke, ZAP)
        run: |
          bash .bigbang/esteira/perfis/deploy/scripts/preparar-alvo.sh
          bash .bigbang/esteira/perfis/deploy/scripts/staging.sh
        env:
          IMAGEM: ${{ needs.imagem.outputs.imagem }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORTA: ${{ vars.VPS_PORTA }}
          VPS_USUARIO: ${{ vars.VPS_USUARIO }}
          VPS_PASTA: ${{ vars.VPS_PASTA }}
          VPS_DOCKER_SUDO: ${{ vars.VPS_DOCKER_SUDO }}
          VPS_ENV_ARQUIVO: ${{ vars.VPS_ENV_ARQUIVO }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          REGISTRY_USUARIO: ${{ vars.REGISTRY_USUARIO }}
          VPS_CHAVE_SSH: ${{ secrets.VPS_CHAVE_SSH }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  publicar:
    needs: [preparar, imagem, staging]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Entrar no GHCR
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Registro das imagens e SBOM (CycloneDX) de cada uma
        run: bash .bigbang/esteira/perfis/deploy/scripts/candidata-sbom.sh
        env:
          IMAGEM: ${{ needs.imagem.outputs.imagem }}
      # Atestados de procedência: grátis em repositório público; em privado exigem GitHub Enterprise Cloud.
      - name: Atestado de procedência das imagens
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: candidata/imagens.sha256
      - name: Pre-release com os digests
        run: bash .bigbang/esteira/perfis/deploy/scripts/candidata-publicar.sh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}
          IMAGEM: ${{ needs.imagem.outputs.imagem }}

  homologar:
    needs: [preparar, publicar]
    if: ${{ vars.PROJETO_OWNER != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Épico em Homologação e PR da release
        run: bash .bigbang/esteira/nucleo/scripts/homologar.sh
        env:
          GH_TOKEN: ${{ secrets.PROJETO_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RC_TAG: ${{ needs.preparar.outputs.tag }}
          PROJETO_OWNER: ${{ vars.PROJETO_OWNER }}
          PROJETO_PLANEJAMENTO: ${{ vars.PROJETO_PLANEJAMENTO }}
          PROJETO_BUGS: ${{ vars.PROJETO_BUGS }}
