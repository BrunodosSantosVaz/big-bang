# Gerado pelo Big Bang v1.5.5 a partir de .bigbang/esteira/nucleo/arquivos/.github/workflows/bb-codeql.yml. Não edite: personalize em bigbang.toml.
# CodeQL (spec 14.2): análise estática do GitHub, com as linguagens detectadas no repositório. Grátis em repositório
# público; em privado exige GitHub Advanced Security (o job é pulado e a Fundação explica a alternativa).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

concurrency:
  group: bb-codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analisar:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
