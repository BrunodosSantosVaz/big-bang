# Gerado pelo Big Bang v2.0.1 a partir de .bigbang/esteira/nucleo/arquivos/.github/ISSUE_TEMPLATE/bb-teste-aceite.yml. Não edite: personalize em bigbang.toml.
name: Testes de aceite
description: Os testes de aceite de um épico, escritos antes das tarefas. Normalmente criada pelo Iniciar sprint.
labels: ["teste-aceite"]
body:
  - type: markdown
    attributes:
      value: |
        **Documentação canônica por visibilidade:** públicos usam a Wiki; privados preservam os arquivos atuais.
        Registre páginas, requisitos, testes e commits na matriz. A entrega, inclusive Flash, exige cobertura,
        links válidos e publicação confirmada. Discussions recebe o primeiro post factual da IA; README apresenta
        o sistema e os links da documentação, comunidade e painéis públicos auditados.
  - type: input
    attributes:
      label: Épico
      description: "#n"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Critérios cobertos
      description: CA-n do épico.
  - type: textarea
    attributes:
      label: Regras de negócio
  - type: textarea
    attributes:
      label: Tarefas que vão implementar cada critério
