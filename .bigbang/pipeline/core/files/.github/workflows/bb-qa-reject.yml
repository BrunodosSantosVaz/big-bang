# Button "QA reject" (v3): with the owner's decision qa:rejected recorded on the epic, the epic passes through
# Rejected back to In Progress and one correction task is born from the release branch (fix/<n>).
name: QA reject

on:
  workflow_dispatch:
    inputs:
      epic:
        description: 'Epic rejected in QA'
        required: true
        type: string
      reason:
        description: 'Reason, in the owner words'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bb-qa-reject-${{ inputs.epic }}
  cancel-in-progress: false

jobs:
  reject:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Correction task
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          EPIC: ${{ inputs.epic }}
          REASON: ${{ inputs.reason }}
        run: python .bigbang/bin/bb.py qa reject "$EPIC" --reason "$REASON"
