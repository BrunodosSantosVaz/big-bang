# Gerado pelo Big Bang v3.0.1 a partir de .bigbang/pipeline/core/files/.github/workflows/bb-controller.yml. Não edite: personalize em bigbang.toml.
# Controller of the v3 single board (ADR-0023/0026): every GitHub event becomes a validated move (bb pipeline
# controller). Dragging a card emits no event on a user Project; the hourly run reconciles the board and marks
# expired claims as stale. Needs the PROJECT_TOKEN secret and the PROJECT_OWNER variable. On PR events the code
# comes from the target branch, never from the PR.
name: Controller

on:
  issues:
    types: [opened, edited, labeled, reopened]
  push:
    branches: ['test/**', 'feature/**', 'docs/**', 'fix/**', 'hotfix/**']
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bb-framework-controller-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}-${{ github.event.action }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'BrunodosSantosVaz/big-bang' && (vars.PROJECT_OWNER != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply the event to the board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          event="$GITHUB_EVENT_NAME"
          [ "$event" != workflow_dispatch ] || event=schedule
          python .bigbang/bin/bb.py pipeline controller --event "$event" --payload "$GITHUB_EVENT_PATH"
