# Gerado pelo Big Bang v3.0.0 a partir de .bigbang/pipeline/core/files/.github/workflows/bb-board-report.yml. Não edite: personalize em bigbang.toml.
# Button "Board report": read only. The state of every open card and the stale claims, in the run summary.
name: Board report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bb-framework-board-report
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'BrunodosSantosVaz/big-bang'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .bigbang/bin/bb.py board show | tee -a "$GITHUB_STEP_SUMMARY"
