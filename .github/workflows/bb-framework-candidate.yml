# Gerado pelo Big Bang v3.1.0 a partir de .bigbang/pipeline/framework/files/.github/workflows/bb-candidate.yml.tmpl. Não edite: personalize em bigbang.toml.
# Candidate of the v3 grouping workflow (ADR-0022): the same build, scan and publication steps of the
# profile; then the epics of the release go to QA (bb pipeline candidate-ready) and the release PR opens.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: bb-framework-candidate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preparar:
    if: github.repository == 'BrunodosSantosVaz/big-bang'
    runs-on: ubuntu-24.04
    outputs:
      pular: ${{ steps.v.outputs.pular }}
      versao: ${{ steps.v.outputs.versao }}
      rc: ${{ steps.v.outputs.rc }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Versão e número da candidata
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .bigbang/esteira/nucleo/scripts/candidata-preparar.sh

  testes:
    needs: preparar
    if: github.repository == 'BrunodosSantosVaz/big-bang' && (needs.preparar.outputs.pular != 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: bash .bigbang/esteira/nucleo/scripts/comando.sh instalar
      - name: Validar testes (Flash reutiliza CI do mesmo commit)
        run: bash .bigbang/pipeline/framework/scripts/testes-candidata.sh
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.repository == 'BrunodosSantosVaz/big-bang'
    needs: [preparar, testes]
    strategy:
      fail-fast: false
      matrix:
        include: [{"sistema": "universal", "runner": "ubuntu-24.04"}]
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.sistema }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar
        shell: bash
        run: bash .bigbang/esteira/nucleo/scripts/comando.sh instalar
        env:
          BB: python .bigbang/bin/bb.py
      - name: Reproducible framework package and SHA-256
        shell: bash
        run: |
          python .bigbang/bin/bb.py verify
          python .bigbang/bin/bb.py framework candidate --output candidata
          python .bigbang/bin/bb.py framework candidate --output "$RUNNER_TEMP/rebuild"
          cmp candidata/bigbang-v*.tar.gz "$RUNNER_TEMP"/rebuild/bigbang-v*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidata-${{ matrix.sistema }}
          path: candidata/
          retention-days: 7

  publicar:
    if: github.repository == 'BrunodosSantosVaz/big-bang'
    needs: [preparar, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: candidata
          pattern: candidata-*
          merge-multiple: true
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: candidata/sbom-cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      # Atestados de procedência: grátis em repositório público; em privado exigem GitHub Enterprise Cloud.
      - name: Atestado de procedência
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'candidata/*'
      - name: Pre-release
        run: |
          python .bigbang/bin/bb.py package --output "$RUNNER_TEMP/notes-package" --notes "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" candidata/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Big Bang $TAG" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}


  candidate-ready:
    needs: [preparar, publicar]
    if: github.repository == 'BrunodosSantosVaz/big-bang' && (vars.PROJECT_OWNER != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop  # trusted code runs with the token; the release branch is only data (--branch)
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Epics of the candidate into QA and the release PR
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RC_TAG: ${{ needs.preparar.outputs.tag }}
        run: python .bigbang/bin/bb.py pipeline candidate-ready --branch "$BRANCH" --rc-tag "$RC_TAG"
